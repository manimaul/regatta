---
apiVersion: v1
kind: Secret
metadata:
  name: regatta-pgbouncer-ini
  namespace: mxmariner
type: Opaque
stringData:
  pgbouncer.ini: |
    [databases]
    # njord's hostNetwork relay, which reaches the managed cluster over IPv6 (free) rather than
    # the pod network's IPv4 (billed). It is a plain TCP forwarder shared with njord's own
    # pools; dbname selects regatta's database on the same cluster.
    regatta = host=njord-db-relay.njord.svc.cluster.local port=6432 dbname=regatta user={REGATTA_PG_USER}

    [pgbouncer]
    # Pod loopback only: the server shares this network namespace, and auth_type=trust must not
    # be reachable at <podIP>:5432 from anything else in the cluster.
    listen_addr = 127.0.0.1
    listen_port = 5432
    auth_type = trust
    auth_file = /etc/pgbouncer/userlist.txt
    pool_mode = transaction
    max_client_conn = 100
    default_pool_size = 10
    server_reset_query =
    # pgjdbc sends extra_float_digits at startup, which pgbouncer otherwise rejects
    # ("unsupported startup parameter"), and uses server-side named prepared statements after a
    # statement's fifth execution, which transaction pooling breaks without this.
    ignore_startup_parameters = extra_float_digits
    max_prepared_statements = 200
---
apiVersion: v1
kind: Secret
metadata:
  name: regatta-pgbouncer-userlist-txt
  namespace: mxmariner
type: Opaque
stringData:
  userlist.txt: |
    "{REGATTA_PG_USER}" "{REGATTA_PG_PASS}"
