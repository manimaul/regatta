apiVersion: autoscaling/v1
kind: HorizontalPodAutoscaler
metadata:
  name: regatta-scaler
  namespace: mxmariner
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: regatta-deployment
  minReplicas: 1
  maxReplicas: 3
  targetCPUUtilizationPercentage: 70
---
apiVersion: v1
kind: Service
metadata:
  name: regatta-service
  namespace: mxmariner
spec:
  ports:
    - name: http
      port: 80
      targetPort: 8888
  selector:
    app: regatta-service
  type: ClusterIP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: regatta-deployment
  namespace: mxmariner
spec:
  selector:
    matchLabels:
      app: regatta-service
  template:
    metadata:
      labels:
        app: regatta-service
    spec:
      imagePullSecrets:
        - name: ghreg
      # The image is built for linux/amd64 only.
      nodeSelector:
        kubernetes.io/arch: amd64
      containers:
        - image: ghcr.io/manimaul/regatta:latest
          imagePullPolicy: Always
          name: regatta-service
          ports:
            - containerPort: 8888
              name: http
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              memory: 256Mi
          env:
            # Through the pgbouncer sidecar on the pod loopback; filled by `cargo xtask`.
            - name: REGATTA_DB_URL
              value: "{REGATTA_DB_URL}"
            - name: RUST_LOG
              value: "info"
          readinessProbe:
            httpGet:
              path: /
              port: 8888
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 8888
            initialDelaySeconds: 10
            periodSeconds: 30
            failureThreshold: 3
        - name: pgbouncer
          image: ghcr.io/cloudnative-pg/pgbouncer:latest
          ports:
            - containerPort: 5432
          resources:
            limits:
              cpu: 250m
              memory: 64Mi
            requests:
              cpu: 50m
              memory: 32Mi
          volumeMounts:
            - name: pgbouncer-config
              mountPath: /etc/pgbouncer
              readOnly: true
      volumes:
        - name: pgbouncer-config
          projected:
            sources:
              - secret:
                  name: regatta-pgbouncer-ini
              - secret:
                  name: regatta-pgbouncer-userlist-txt
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: regatta-cert
  namespace: mxmariner
spec:
  secretName: regatta-cert
  commonName: regatta.mxmariner.com
  dnsNames:
    - regatta.mxmariner.com
  issuerRef:
    kind: ClusterIssuer
    name: letsencrypt-prod
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: regatta
  namespace: mxmariner
spec:
  ingressClassName: haproxy
  rules:
    - host: regatta.mxmariner.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: regatta-service
                port:
                  number: 80
  tls:
    - hosts:
        - regatta.mxmariner.com
      secretName: regatta-cert
