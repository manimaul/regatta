[package]
name = "regatta-contract"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Contract cassettes for the regatta REST API: record from one server, replay or diff against another"

[lib]
name = "regatta_contract"
path = "src/lib.rs"

[[bin]]
name = "regatta-contract"
path = "src/main.rs"

[dependencies]
anyhow = { workspace = true }
base64 = { workspace = true }
clap = { workspace = true }
flate2 = { workspace = true }
jiff = { workspace = true }
proptest = { workspace = true }
reqwest = { workspace = true }
serde = { workspace = true }
# preserve_order: key order is part of the contract (Kotlin declaration order); with it the canonical
# re-serialisation keeps each side's order so order mismatches are reported, separately from value ones.
serde_json = { workspace = true, features = ["preserve_order"] }
sha2 = { workspace = true }
similar = { workspace = true }
tokio = { workspace = true }

[dev-dependencies]
axum = { workspace = true }
