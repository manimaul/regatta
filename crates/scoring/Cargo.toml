[package]
name = "regatta-scoring"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[features]
# The test fixture DSL (`fixture` module), for this crate's tests and the server crate's.
fixture = []

[dependencies]
regatta-common = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
# The season switch and the fixture's Pacific local times need the tz database.
jiff = { workspace = true, features = ["tzdb-bundle-always"] }

[dev-dependencies]
# Integration tests under tests/ see the crate as a dependency, so they need the feature on.
regatta-scoring = { path = ".", features = ["fixture"] }
proptest = { workspace = true }
pretty_assertions = { workspace = true }
